    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Apply the theme before first paint so the page never flashes the wrong
      // one. Keep the storage key in sync with src/lib/theme.ts.
      (function () {
        // A saved choice (from the header toggle) wins; otherwise follow the OS.
        var saved = function () {
          try {
            var t = localStorage.getItem('theme');
            return t === 'light' || t === 'dark' ? t : null;
          } catch (e) {
            return null;
          }
        };
        var media = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          document.documentElement.dataset.theme = saved() || (media.matches ? 'dark' : 'light');
        };
        apply();
        // Keep following the OS if it switches while the page is open.
        media.addEventListener('change', function () {
          if (!saved()) apply();
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
